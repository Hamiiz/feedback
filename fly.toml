# fly.toml app configuration file generated for feedback-s on 2026-10-05T21:24:33Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "feedback-s"
primary_region = 'ams'

[build]
  build_command = "npm install --include=dev && npm run prisma:migrate && npm run build"

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'off'
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[processes]
  app = 'npm run start'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
